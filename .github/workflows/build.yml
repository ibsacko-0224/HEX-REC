# À placer dans le dépôt : .github/workflows/build.yml
# Le dépôt doit contenir à la racine : HEX-REC-Android.zip
name: Construire l'APK HEX-REC

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Ouvrir le zip du projet
        run: unzip -q HEX-REC-Android.zip -d projet

      - name: Compiler l'APK
        run: cd projet/HEX-REC && gradle assembleDebug --stacktrace

      - name: Publier l'APK (téléchargement direct, sans zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" \
            projet/HEX-REC/app/build/outputs/apk/debug/app-debug.apk \
            --title "HEX-REC - build ${{ github.run_number }}" \
            --notes "APK de test, à installer directement sur le téléphone." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: HEX-REC-apk
          path: projet/HEX-REC/app/build/outputs/apk/debug/*.apk
